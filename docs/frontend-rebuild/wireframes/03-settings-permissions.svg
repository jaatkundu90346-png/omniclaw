<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="OmniClaw V2 settings and permissions hub wireframe">
  <rect width="1440" height="900" fill="#111112"/>
  <rect x="48" y="40" width="1344" height="820" rx="30" fill="#1d1d1e"/>
  <rect x="96" y="92" width="360" height="716" rx="24" fill="#252526"/>
  <text x="132" y="146" fill="#f3efe8" font-family="Inter" font-size="30" font-weight="760">Settings hub</text>
  <text x="132" y="182" fill="#a69e94" font-family="Inter" font-size="14">Every OmniClaw control in one place.</text>
  <rect x="132" y="228" width="288" height="48" rx="14" fill="#353638"/>
  <text x="160" y="258" fill="#f3efe8" font-family="Inter" font-size="16" font-weight="700">Profile and personalization</text>
  <rect x="132" y="292" width="288" height="48" rx="14" fill="#2d2e30"/>
  <text x="160" y="322" fill="#d8d1c7" font-family="Inter" font-size="16">Brain and BYOK</text>
  <rect x="132" y="356" width="288" height="48" rx="14" fill="#2d2e30"/>
  <text x="160" y="386" fill="#d8d1c7" font-family="Inter" font-size="16">Computer access</text>
  <rect x="132" y="420" width="288" height="48" rx="14" fill="#2d2e30"/>
  <text x="160" y="450" fill="#d8d1c7" font-family="Inter" font-size="16">Permissions and approvals</text>
  <rect x="132" y="484" width="288" height="48" rx="14" fill="#2d2e30"/>
  <text x="160" y="514" fill="#d8d1c7" font-family="Inter" font-size="16">Agents, skills, tools</text>
  <rect x="132" y="548" width="288" height="48" rx="14" fill="#2d2e30"/>
  <text x="160" y="578" fill="#d8d1c7" font-family="Inter" font-size="16">Memory and knowledge</text>
  <rect x="132" y="612" width="288" height="48" rx="14" fill="#2d2e30"/>
  <text x="160" y="642" fill="#d8d1c7" font-family="Inter" font-size="16">Channels and connectors</text>

  <text x="508" y="136" fill="#f3efe8" font-family="Inter" font-size="28" font-weight="760">Computer access</text>
  <text x="508" y="170" fill="#a69e94" font-family="Inter" font-size="14">Visible, reversible permissions for local hands and eyes.</text>

  <rect x="508" y="220" width="384" height="174" rx="24" fill="#f7f4ed"/>
  <text x="540" y="260" fill="#1c1b19" font-family="Inter" font-size="19" font-weight="760">File access roots</text>
  <text x="540" y="292" fill="#686058" font-family="Inter" font-size="14">Search and edit only approved folders unless owner mode is enabled.</text>
  <rect x="540" y="326" width="300" height="38" rx="12" fill="#ffffff" stroke="#ddd4c9"/>
  <text x="560" y="350" fill="#312e2b" font-family="JetBrains Mono" font-size="12">C:\Users\PATEL COMPUTERS</text>

  <rect x="924" y="220" width="384" height="174" rx="24" fill="#f7f4ed"/>
  <text x="956" y="260" fill="#1c1b19" font-family="Inter" font-size="19" font-weight="760">Terminal policy</text>
  <text x="956" y="292" fill="#686058" font-family="Inter" font-size="14">Commands are grouped by risk with ask/allow/deny controls.</text>
  <rect x="956" y="326" width="92" height="34" rx="17" fill="#111"/>
  <text x="982" y="348" fill="#fff" font-family="Inter" font-size="13">Ask</text>
  <rect x="1062" y="326" width="92" height="34" rx="17" fill="#e7e0d6"/>
  <text x="1084" y="348" fill="#3a332e" font-family="Inter" font-size="13">Allow</text>
  <rect x="1168" y="326" width="92" height="34" rx="17" fill="#e7e0d6"/>
  <text x="1192" y="348" fill="#3a332e" font-family="Inter" font-size="13">Deny</text>

  <rect x="508" y="426" width="384" height="174" rx="24" fill="#f7f4ed"/>
  <text x="540" y="466" fill="#1c1b19" font-family="Inter" font-size="19" font-weight="760">Browser access</text>
  <text x="540" y="498" fill="#686058" font-family="Inter" font-size="14">Use local browser, screenshots, click/type, and automation trace.</text>
  <rect x="540" y="532" width="134" height="34" rx="17" fill="#111"/>
  <text x="568" y="554" fill="#fff" font-family="Inter" font-size="13">Enabled</text>

  <rect x="924" y="426" width="384" height="174" rx="24" fill="#f7f4ed"/>
  <text x="956" y="466" fill="#1c1b19" font-family="Inter" font-size="19" font-weight="760">Delete and write gates</text>
  <text x="956" y="498" fill="#686058" font-family="Inter" font-size="14">Danger actions require confirmation unless user sets owner mode.</text>
  <rect x="956" y="532" width="180" height="34" rx="17" fill="#fff0e8" stroke="#f1c5a8"/>
  <text x="980" y="554" fill="#a74816" font-family="Inter" font-size="13">Ask before delete</text>

  <rect x="508" y="632" width="800" height="110" rx="24" fill="#2a2b2d"/>
  <text x="540" y="672" fill="#f3efe8" font-family="Inter" font-size="18" font-weight="760">Approval timeline</text>
  <circle cx="548" cy="712" r="6" fill="#4aa3ff"/>
  <text x="568" y="717" fill="#d8d1c7" font-family="Inter" font-size="14">Requested: delete temp build folder</text>
  <circle cx="840" cy="712" r="6" fill="#e2b66a"/>
  <text x="860" y="717" fill="#d8d1c7" font-family="Inter" font-size="14">Allowed: npm run build</text>
  <rect x="1148" y="682" width="122" height="38" rx="19" fill="#f3efe8"/>
  <text x="1184" y="707" fill="#111112" font-family="Inter" font-size="13" font-weight="700">Review</text>
</svg>
